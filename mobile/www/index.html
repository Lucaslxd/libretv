<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>LibreTV</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06090f;
        color: #8b97b0;
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .box {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #7c5cff;
        box-shadow: 0 0 16px #22d3ee;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      p {
        margin: 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="dot"></div>
      <p>正在连接 LibreTV…</p>
    </div>
  </body>
</html>
