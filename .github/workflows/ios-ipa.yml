name: Build iOS IPA (unsigned)

# 在 GitHub 的 macOS runner 上构建「未签名」IPA，供 AltStore / SideStore 用免费 Apple ID 自签安装
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'App 加载的服务器地址（建议 https，末尾带 /）'
        required: true
        default: 'https://example.com/'
      app_id:
        description: 'Bundle ID（同一 Apple ID 下不要重复）'
        required: false
        default: 'com.libretv.app'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: 生成 iOS 工程并同步
        working-directory: mobile
        env:
          APP_SERVER_URL: ${{ github.event.inputs.server_url || 'https://example.com/' }}
          APP_ID: ${{ github.event.inputs.app_id || 'com.libretv.app' }}
        run: |
          echo "server = $APP_SERVER_URL / id = $APP_ID"
          node copy-web.js
          # 仓库中的 ios 工程可能不完整（缺 scheme / workspace），一律重建保证可构建
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: 允许明文 http（服务器为 http 时才需要）
        run: |
          PLIST=mobile/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"

      - name: 安装 Pods
        working-directory: mobile/ios/App
        run: pod install --repo-update

      - name: 构建（不签名）
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: 日志摘要
        if: always()
        working-directory: mobile/ios/App
        run: |
          echo "=== 关键行 ==="
          grep -nE "error:|\*\* BUILD (FAILED|SUCCEEDED) \*\*|The following build commands failed|does not contain a scheme" xcodebuild.log | head -30 || true
          echo "=== 注解 ==="
          grep -E "error:" xcodebuild.log | head -5 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g' | cut -c1-400)
            echo "::error::$safe"
          done || true

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mobile/ios/App/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 产物检查
        run: |
          ls -la mobile/ios/App/build/Build/Products/ || true
          ls -la mobile/ios/App/build/Build/Products/Release-iphoneos/ || true
          du -sh mobile/ios/App/build/Build/Products/Release-iphoneos/App.app || true
          find mobile/ios/App/build/Build/Products/Release-iphoneos/App.app -maxdepth 1 || true

      - name: 打包未签名 IPA
        run: |
          mkdir -p Payload
          cp -R mobile/ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry libretv-unsigned.ipa Payload
          ls -lh libretv-unsigned.ipa
          unzip -l libretv-unsigned.ipa | head -20
          du -sh Payload/App.app

      - uses: actions/upload-artifact@v4
        with:
          name: libretv-unsigned-ipa
          path: libretv-unsigned.ipa
          retention-days: 14
